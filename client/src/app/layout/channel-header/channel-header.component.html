<section class="channel" data-screen-label="01 Channel header">
  <div class="banner">
    <div class="banner__grid"></div>
    <pre class="banner__ascii">{{ ascii }}</pre>
    <div class="banner__terminal">
      @for (line of terminal(); track $index) {
        <div>
          <span>{{ line[0] }}</span
          ><b>{{ line[1] }}</b>
        </div>
      }
    </div>
  </div>

  <div class="profile">
    <div class="profile__avatar" role="img" [attr.aria-label]="content().author"></div>
    <div class="profile__meta">
      <h1>{{ content().author }} — <span>tech lead</span></h1>
      <div class="profile__handle">
        &#64;super-dev.app · {{ content().featuredCategory.replace('#', '') }}
      </div>
      <div class="profile__stats">
        <span
          >{{ content().joined }} <b>{{ content().joinedYear }}</b></span
        >
      </div>
      <p class="profile__bio">{{ content().bio }}</p>
    </div>
    <div class="profile__actions">
      <button class="btn btn--ghost btn--sm">
        <sd-icon name="share" [size]="14" /> {{ content().share }}
      </button>
      <a class="btn btn--ghost btn--sm" [href]="content().cvUrl" download>
        <sd-icon name="download" [size]="14" /> {{ content().cv }}
      </a>
      <button
        [class]="subscribed() ? 'btn btn--grow' : 'btn btn--primary btn--grow'"
        (click)="subscribed.update((isSubscribed) => !isSubscribed)"
      >
        @if (subscribed()) {
          <sd-icon name="bell" [size]="14" />
        }
        {{ subscribed() ? content().subscribed : content().subscribe }}
      </button>
    </div>
  </div>
</section>
