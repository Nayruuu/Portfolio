name: Deploy - Infra

on:
  workflow_dispatch:
  # Push auto-trigger is OFF during the mono-commit/force-push phase (force-push bypasses
  # path filters → every workflow would run on each push). Re-enable with normal git history:
  # push:
  #   branches: [main]
  #   paths: [infra/**]

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: infra

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate terraform.tfvars.json
        working-directory: infra
        run: |
          cat <<EOF > terraform.tfvars.json
          {
            "subscription_id": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "location": "${{ vars.TF_VAR_LOCATION }}",
            "resend_api_key": "${{ secrets.RESEND_API_KEY }}"
          }
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra
        run: terraform apply -auto-approve -input=false
