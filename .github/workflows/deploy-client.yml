name: Deploy - Client

on:
  workflow_dispatch:
  # The front auto-deploys when client/ changes on main. On a force-push GitHub's path filtering
  # may see every file as changed and over-trigger — benign (an idempotent SSG redeploy).
  # infra/api keep their `push:` triggers OFF so a push never fires a destructive Terraform
  # apply or function deploy; they run via workflow_dispatch.
  push:
    branches: [main]
    paths: [client/**]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Azure OIDC login
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Azure Login via OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build SSG
        working-directory: client
        run: |
          npm ci
          npm run build:ssg

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli@latest

      # The SWA deploy token is fetched at runtime via OIDC — no stored secret.
      - name: Fetch SWA deployment token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name swa-sd-web \
            --resource-group rg-infra-web \
            --query "properties.apiKey" -o tsv)
          echo "SWA_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Deploy with SWA CLI
        working-directory: client
        run: |
          swa deploy dist/super-dev-portfolio/browser \
            --deployment-token "$SWA_TOKEN" \
            --env production

      # AFTER the deploy so the key file is live when the engines validate it. Notifies
      # Bing/DuckDuckGo/Yandex/Naver (Google follows the sitemap's real lastmod instead).
      # Non-blocking by design: a failed hint never fails a deploy that already succeeded.
      - name: Ping IndexNow
        working-directory: client
        run: npm run ping:indexnow
