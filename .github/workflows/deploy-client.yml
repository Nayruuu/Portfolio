name: Deploy - Client

on:
  workflow_dispatch:
  # The front auto-deploys on ANY push to main — deliberately NOT `paths: [client/**]`-filtered.
  # The mono-commit amend + force-push flow rewrites history, and GitHub's path-diff against the
  # now-orphaned `before` commit is unreliable on a force-push (it silently skipped the run on
  # 2026-08-13, leaving the site stale). The mono-commit always touches client/** anyway, so the
  # filter only bought fragility. Redeploy is an idempotent SSG build. (api has its own workflow.)
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Azure OIDC login
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Azure Login via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build SSG
        working-directory: client
        run: |
          npm ci
          npm run build:ssg

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli@latest

      # The SWA deploy token is fetched at runtime via OIDC — no stored secret.
      - name: Fetch SWA deployment token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name swa-sd-web \
            --resource-group rg-infra-web \
            --query "properties.apiKey" -o tsv)
          echo "SWA_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Deploy with SWA CLI
        working-directory: client
        run: |
          swa deploy dist/super-dev-portfolio/browser \
            --deployment-token "$SWA_TOKEN" \
            --env production

      # AFTER the deploy so the key file is live when the engines validate it. Notifies
      # Bing/DuckDuckGo/Yandex/Naver (Google follows the sitemap's real lastmod instead).
      # Non-blocking by design: a failed hint never fails a deploy that already succeeded.
      - name: Ping IndexNow
        working-directory: client
        run: npm run ping:indexnow
